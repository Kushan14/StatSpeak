plugins {
    id 'java'
    id 'application'
}

group = 'com.statspeak'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Apache PDFBox for PDF report generation
    implementation 'org.apache.pdfbox:pdfbox:2.0.29'

    // FlatLaf modern UI Look and Feel
    implementation 'com.formdev:flatlaf:3.4.1'

    // JUnit 5 for testing
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
}

application {
    mainClass = 'com.statspeak.app.Main'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes(
            'Main-Class': 'com.statspeak.app.Main',
            'Implementation-Title': 'StatSpeak',
            'Implementation-Version': project.version
        )
    }
    // Bundle all runtime dependencies into a standalone executable Fat JAR
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}
